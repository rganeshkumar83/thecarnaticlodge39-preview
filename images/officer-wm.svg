<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12233c"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="goldJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6214"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#avBg)"/>
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldJ)" stroke-width="2"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Dignified Silhouette in Dark Suit & Masonic Collar -->
  <g transform="translate(150, 160)">
    <!-- Shoulders / Coat -->
    <path d="M-85,120 L85,120 L75,60 C55,25 35,25 0,35 C-35,25 -55,25 -75,60 Z" fill="#050a12"/>
    <!-- White Shirt & Tie -->
    <polygon points="0,35 -20,20 -15,10 0,15 15,10 20,20" fill="#fdfdfd"/>
    <polygon points="0,20 -6,75 0,90 6,75" fill="#182333"/>
    <!-- Head Silhouette -->
    <ellipse cx="0" cy="-35" rx="36" ry="46" fill="#152132" stroke="#d4af37" stroke-width="1.2"/>
    <!-- Master's Collar -->
    <path d="M-40,25 C-30,70 -10,85 0,85 C10,85 30,70 40,25" fill="none" stroke="url(#goldJ)" stroke-width="6"/>
    <!-- Square Jewel (Master) -->
    <polygon points="0,85 -22,107 -17,112 0,95 17,112 22,107" fill="url(#goldJ)" stroke="#503505" stroke-width="1"/>
  </g>
</svg>
