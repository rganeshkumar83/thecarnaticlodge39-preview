<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#AA771C" />
      <stop offset="85%" stop-color="#85580F" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142642" />
      <stop offset="50%" stop-color="#0b1626" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>

    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEFA6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#B8860B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b1626" stop-opacity="0" />
    </radialGradient>

    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Ring with Filigree Dots -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Outer Deep Navy Band -->
  <circle cx="250" cy="250" r="220" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Circular Text Path -->
  <path id="textCircleUpper" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
  <path id="textCircleLower" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />

  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="22" font-weight="800" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#textCircleUpper" startOffset="50%" text-anchor="middle">
      THE CARNATIC LODGE NO: 39
    </textPath>
  </text>

  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="16" font-weight="700" fill="#E8D18C" letter-spacing="3.5">
    <textPath href="#textCircleLower" startOffset="50%" text-anchor="middle">
      LOVE AND TRUTH • ESTD 1883
    </textPath>
  </text>

  <!-- Small Gold Decorative Stars on the Ring -->
  <g fill="url(#goldGrad)" transform="translate(68, 250) scale(0.7)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5"/>
  </g>
  <g fill="url(#goldGrad)" transform="translate(432, 250) scale(0.7)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5"/>
  </g>

  <!-- Inner Gold Beaded Border -->
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="250" cy="250" r="144" fill="none" stroke="#E8D18C" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Center Shield Background -->
  <circle cx="250" cy="250" r="140" fill="#0b1626" />
  <circle cx="250" cy="250" r="140" fill="url(#sunburst)" />

  <!-- Radiant Glory Rays in Background -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.35">
    <line x1="250" y1="120" x2="250" y2="140" />
    <line x1="250" y1="360" x2="250" y2="380" />
    <line x1="120" y1="250" x2="140" y2="250" />
    <line x1="360" y1="250" x2="380" y2="250" />
    <line x1="158" y1="158" x2="172" y2="172" />
    <line x1="342" y1="342" x2="328" y2="328" />
    <line x1="158" y1="342" x2="172" y2="328" />
    <line x1="342" y1="158" x2="328" y2="172" />
  </g>

  <!-- All-Seeing Eye Triangle at Top Center -->
  <g transform="translate(250, 148) scale(0.65)">
    <polygon points="0,-35 -40,30 40,30" fill="#142642" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Eye -->
    <path d="M-22,8 Q0,-12 22,8 Q0,26 -22,8 Z" fill="#fff" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="8" r="6" fill="#1e3a8a"/>
    <circle cx="0" cy="8" r="2.5" fill="#000"/>
  </g>

  <!-- Masonic Square and Compasses -->
  <g id="square-and-compasses" filter="url(#goldShadow)">
    <!-- Compasses -->
    <circle cx="250" cy="182" r="12" fill="url(#goldGrad)" stroke="#664405" stroke-width="1.5" />
    <circle cx="250" cy="182" r="5" fill="#0b1626" />

    <!-- Left Compass Leg -->
    <path d="M 245,185 L 182,328 L 194,332 L 253,192 Z" fill="url(#goldGrad)" stroke="#5A3A05" stroke-width="1" />
    <!-- Right Compass Leg -->
    <path d="M 255,185 L 318,328 L 306,332 L 247,192 Z" fill="url(#goldGrad)" stroke="#5A3A05" stroke-width="1" />

    <!-- The Square -->
    <path d="M 250,305 L 152,228 L 163,215 L 250,282 Z" fill="#e2e8f0" stroke="#5A3A05" stroke-width="1" />
    <path d="M 250,305 L 348,228 L 337,215 L 250,282 Z" fill="#e2e8f0" stroke="#5A3A05" stroke-width="1" />
    <polygon points="250,282 238,292 250,312 262,292" fill="url(#goldGrad)" stroke="#5A3A05" stroke-width="1" />

    <!-- Letter 'G' in Center -->
    <text x="250" y="258" font-family="'Cinzel', 'Times New Roman', serif" font-size="42" font-weight="700" 
          fill="url(#goldGrad)" stroke="#593902" stroke-width="1" text-anchor="middle" dominant-baseline="central">
      G
    </text>
  </g>

  <!-- Bottom Banner Ribbon: No: 39 -->
  <g transform="translate(250, 355)">
    <rect x="-42" y="-12" width="84" height="24" rx="6" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="3" font-family="'Cinzel', serif" font-size="13" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="middle">
      No: 39
    </text>
  </g>
</svg>
