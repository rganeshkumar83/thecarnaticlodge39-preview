<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hallIntBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="60%" stop-color="#11223b"/>
      <stop offset="100%" stop-color="#060c16"/>
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="50%" stop-color="#ffe494"/>
      <stop offset="100%" stop-color="#9a7322"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#hallIntBg)"/>
  
  <!-- Corinthian Arches -->
  <path d="M50,450 L50,160 Q400,30 750,160 L750,450" fill="none" stroke="url(#goldArch)" stroke-width="2.5" opacity="0.4"/>
  <path d="M90,450 L90,180 Q400,60 710,180 L710,450" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Asoka Hall Crest / Masonic Ceiling Rosette -->
  <circle cx="400" cy="110" r="50" fill="#091322" stroke="url(#goldArch)" stroke-width="2"/>
  <circle cx="400" cy="110" r="42" fill="none" stroke="#d4af37" stroke-dasharray="4,4"/>
  <polygon points="400,80 408,102 430,102 412,116 418,138 400,124 382,138 388,116 370,102 392,102" fill="url(#goldArch)"/>

  <!-- Left Column Boaz -->
  <rect x="140" y="160" width="30" height="290" fill="url(#goldArch)"/>
  <rect x="130" y="145" width="50" height="15" rx="3" fill="url(#goldArch)"/>
  <circle cx="155" cy="125" r="18" fill="url(#goldArch)"/>
  
  <!-- Right Column Jachin -->
  <rect x="630" y="160" width="30" height="290" fill="url(#goldArch)"/>
  <rect x="620" y="145" width="50" height="15" rx="3" fill="url(#goldArch)"/>
  <circle cx="645" cy="125" r="18" fill="url(#goldArch)"/>

  <!-- Perspective Mosaic Pavement -->
  <polygon points="100,500 240,360 560,360 700,500" fill="#080f1a" stroke="#d4af37" stroke-width="1.5"/>
  <g stroke="#d4af37" stroke-width="0.8" opacity="0.35">
    <line x1="100" y1="500" x2="350" y2="360"/>
    <line x1="250" y1="500" x2="390" y2="360"/>
    <line x1="400" y1="500" x2="400" y2="360"/>
    <line x1="550" y1="500" x2="410" y2="360"/>
    <line x1="700" y1="500" x2="450" y2="360"/>
    <line x1="140" y1="460" x2="660" y2="460"/>
    <line x1="180" y1="420" x2="620" y2="420"/>
    <line x1="210" y1="390" x2="590" y2="390"/>
  </g>

  <!-- Central Altar with Open VSL -->
  <g transform="translate(400, 360)">
    <rect x="-55" y="-35" width="110" height="55" fill="#13233c" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="0" cy="-7" r="14" fill="#091322" stroke="#d4af37" stroke-width="1"/>
    <text x="0" y="-3" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#d4af37" text-anchor="middle">39</text>
    <path d="M-35,-42 Q-15,-50 0,-44 Q15,-50 35,-42 L35,-35 Q15,-42 0,-38 Q-15,-42 -35,-35 Z" fill="#fffdf5" stroke="#c5a059"/>
  </g>

  <!-- East Dais & Master's Chair -->
  <g transform="translate(400, 225)">
    <path d="M-60,-50 L60,-50 L50,-20 L-50,-20 Z" fill="#7b1113" stroke="#d4af37" stroke-width="1.2"/>
    <rect x="-30" y="-20" width="60" height="75" rx="3" fill="#08101c" stroke="#d4af37" stroke-width="1.5"/>
    <rect x="-24" y="-14" width="48" height="60" fill="#540c0e"/>
    <polygon points="0,0 -8,12 8,12" fill="#d4af37"/>
  </g>

  <!-- Banner at base -->
  <rect x="220" y="460" width="360" height="30" rx="4" fill="#070e1a" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="480" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#d4af37" letter-spacing="3" text-anchor="middle">
    INTERIOR OF FREEMASONS' HALL • EGMORE
  </text>
</svg>
