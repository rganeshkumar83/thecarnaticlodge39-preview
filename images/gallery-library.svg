<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#14243b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#libBg)"/>

  <!-- Bookshelves & Archival Volumes -->
  <g transform="translate(100, 80)">
    <!-- Shelf 1 -->
    <rect x="0" y="50" width="600" height="15" fill="#c5a059"/>
    <!-- Books on Shelf 1 -->
    <rect x="30" y="-30" width="22" height="80" fill="#7b1113"/>
    <rect x="54" y="-20" width="26" height="70" fill="#1e3a8a"/>
    <rect x="82" y="-35" width="20" height="85" fill="#065f46"/>
    <rect x="104" y="-25" width="30" height="75" fill="#78350f"/>
    <rect x="136" y="-30" width="24" height="80" fill="#1e293b"/>
    <rect x="162" y="-15" width="28" height="65" fill="#831843"/>
    <rect x="420" y="-35" width="35" height="85" fill="#1e3a8a"/>
    <rect x="458" y="-25" width="25" height="75" fill="#78350f"/>
    <rect x="485" y="-30" width="22" height="80" fill="#7b1113"/>

    <!-- Shelf 2 -->
    <rect x="0" y="190" width="600" height="15" fill="#c5a059"/>
    <!-- Books on Shelf 2 -->
    <rect x="40" y="110" width="32" height="80" fill="#1e3a8a"/>
    <rect x="74" y="100" width="24" height="90" fill="#78350f"/>
    <rect x="100" y="115" width="26" height="75" fill="#7b1113"/>
    <rect x="128" y="105" width="20" height="85" fill="#065f46"/>
    <rect x="440" y="100" width="40" height="90" fill="#1e293b"/>
    <rect x="482" y="110" width="30" height="80" fill="#831843"/>

    <!-- Reading Desk with Open Ancient Minute Book -->
    <polygon points="180,310 420,310 450,380 150,380" fill="#080f1a" stroke="#d4af37" stroke-width="2"/>
    <!-- Open Book -->
    <path d="M250,320 Q280,310 300,318 Q320,310 350,320 L345,345 Q320,335 300,342 Q280,335 255,345 Z" fill="#fffdfa" stroke="#c5a059" stroke-width="1.5"/>
    <line x1="300" y1="318" x2="300" y2="342" stroke="#c5a059" stroke-width="1.5"/>
    <!-- Antique Quill & Inkpot -->
    <circle cx="370" cy="335" r="7" fill="#c5a059"/>
    <line x1="370" y1="335" x2="385" y2="310" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title Ribbon -->
  <rect x="230" y="440" width="340" height="32" rx="4" fill="#080f1a" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="462" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#d4af37" letter-spacing="3" text-anchor="middle">
    HISTORIC ARCHIVES & LODGE LIBRARY
  </text>
</svg>
