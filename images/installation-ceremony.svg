<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="instGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="100%" stop-color="#15263d" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#instGrad)"/>
  
  <!-- Master's Collar, Gavel, and Pedestal in Golden Light -->
  <circle cx="400" cy="200" r="150" fill="#d4af37" opacity="0.1"/>
  
  <!-- The Master's Gavel & Square -->
  <g transform="translate(400, 210)">
    <!-- Master's Collar Garland -->
    <path d="M-100,-100 C-120,40 -20,110 0,110 C20,110 120,40 100,-100" fill="none" stroke="#d4af37" stroke-width="8" stroke-dasharray="8,4"/>
    
    <!-- Square Collar Jewel hanging at point of collar -->
    <polygon points="0,110 -40,150 -32,158 0,126 32,158 40,150" fill="#f5db8b" stroke="#78500c" stroke-width="1.5"/>
    
    <!-- Gavel on Sounding Block -->
    <g transform="translate(0, 10)">
      <!-- Gavel Head -->
      <rect x="-35" y="-55" width="70" height="24" rx="4" fill="#a67c2e" stroke="#ffe7a3" stroke-width="1.5"/>
      <rect x="-30" y="-53" width="60" height="20" rx="3" fill="#694d1b"/>
      <!-- Gavel Handle -->
      <rect x="-7" y="-31" width="14" height="65" rx="3" fill="#a67c2e" stroke="#ffe7a3" stroke-width="1.5"/>
      <!-- Sounding Block -->
      <polygon points="-55,45 55,45 45,55 -45,55" fill="#4a3411" stroke="#d4af37" stroke-width="1"/>
    </g>
  </g>

  <!-- Banner at Base -->
  <g transform="translate(400, 420)">
    <rect x="-240" y="-20" width="480" height="40" rx="6" fill="#070e17" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#d4af37" letter-spacing="3" text-anchor="middle">
      ANNUAL INSTALLATION OF THE WORSHIPFUL MASTER
    </text>
  </g>
</svg>
