<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="charG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2e" />
      <stop offset="100%" stop-color="#142c4c" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#charG)"/>
  
  <!-- Radiance circle -->
  <circle cx="400" cy="220" r="180" fill="#d4af37" opacity="0.06"/>
  <circle cx="400" cy="220" r="170" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Hands of Brotherly Love & Relief -->
  <g transform="translate(400, 220)">
    <!-- Heart Symbol -->
    <path d="M0,40 C-80,-20 -90,-80 0,-110 C90,-80 80,-20 0,40 Z" fill="#7b1113" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Open Book / Education Lamp inside Heart -->
    <path d="M -40,-45 C -20,-52 0,-48 0,-48 C 0,-48 20,-52 40,-45 L 40,-15 C 20,-22 0,-18 0,-18 C 0,-18 -20,-22 -40,-15 Z" fill="#fff9eb" stroke="#c5a059" stroke-width="1.5"/>
    <line x1="0" y1="-48" x2="0" y2="-18" stroke="#c5a059" stroke-width="1.5"/>

    <!-- Clasped Supporting Hands underneath -->
    <path d="M-120,60 C-80,40 -40,50 -20,65 L0,50 L20,65 C40,50 80,40 120,60" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
    <path d="M-130,80 L-90,60 M130,80 L90,60" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 3 Pillar Ribbon Values: RELIEF • EDUCATION • HEALTH -->
  <g transform="translate(400, 390)">
    <rect x="-260" y="-22" width="520" height="44" rx="22" fill="#07101c" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Cinzel', serif" font-size="15" font-weight="700" fill="#e8c86d" letter-spacing="4" text-anchor="middle">
      RELIEF • SCHOLARSHIPS • HEALTHCARE • COMMUNITY
    </text>
  </g>
</svg>
