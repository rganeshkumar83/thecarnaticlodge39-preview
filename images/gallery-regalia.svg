<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="regBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#142642"/>
    </linearGradient>
    <linearGradient id="regGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6418"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#regBg)"/>

  <!-- Master Mason / Past Master Apron Illustration -->
  <g transform="translate(400, 240)">
    <!-- Apron Body -->
    <rect x="-180" y="-80" width="360" height="260" rx="10" fill="#f8f9fa" stroke="#c5a059" stroke-width="3"/>
    
    <!-- Light Blue / Cyan Masonic Border Ribbons -->
    <rect x="-170" y="-70" width="340" height="240" fill="none" stroke="#2563eb" stroke-width="18"/>
    <rect x="-160" y="-60" width="320" height="220" fill="none" stroke="url(#regGold)" stroke-width="3"/>

    <!-- Apron Flap (Triangle) -->
    <polygon points="-180,-80 0,60 180,-80" fill="#f8f9fa" stroke="#c5a059" stroke-width="3"/>
    <polygon points="-160,-80 0,42 160,-80" fill="none" stroke="#2563eb" stroke-width="12"/>

    <!-- Three Rosettes / Levels for Master Mason -->
    <circle cx="-100" cy="110" r="22" fill="#2563eb" stroke="url(#regGold)" stroke-width="2"/>
    <circle cx="100" cy="110" r="22" fill="#2563eb" stroke="url(#regGold)" stroke-width="2"/>
    <circle cx="0" cy="-20" r="22" fill="#2563eb" stroke="url(#regGold)" stroke-width="2"/>

    <!-- Two Tassels with 7 Chains each -->
    <path d="M-40,-75 L-40,80 M40,-75 L40,80" stroke="#2563eb" stroke-width="6"/>
    <circle cx="-40" cy="85" r="9" fill="url(#regGold)"/>
    <circle cx="40" cy="85" r="9" fill="url(#regGold)"/>
  </g>

  <!-- Title Ribbon -->
  <rect x="230" y="440" width="340" height="32" rx="4" fill="#080f1a" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="462" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#d4af37" letter-spacing="3" text-anchor="middle">
    CRAFT REGALIA & SYMBOLS OF OFFICE
  </text>
</svg>
