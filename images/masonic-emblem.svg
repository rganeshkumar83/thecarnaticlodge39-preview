<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="embGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#85580F" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Compasses -->
    <circle cx="100" cy="40" r="10" fill="url(#embGold)" stroke="#664405" stroke-width="1.2" />
    <circle cx="100" cy="40" r="4" fill="#0B1A30" />
    <path d="M 96,42 L 48,155 L 58,158 L 102,48 Z" fill="url(#embGold)" stroke="#5A3A05" stroke-width="0.8"/>
    <path d="M 104,42 L 152,155 L 142,158 L 98,48 Z" fill="url(#embGold)" stroke="#5A3A05" stroke-width="0.8"/>

    <!-- Square -->
    <path d="M 100,140 L 25,80 L 34,70 L 100,122 Z" fill="url(#embGold)" stroke="#5A3A05" stroke-width="0.8"/>
    <path d="M 100,140 L 175,80 L 166,70 L 100,122 Z" fill="url(#embGold)" stroke="#5A3A05" stroke-width="0.8"/>
    <polygon points="100,122 90,130 100,148 110,130" fill="url(#embGold)" stroke="#5A3A05" stroke-width="0.8"/>

    <!-- Letter 'G' -->
    <text x="100" y="103" font-family="'Cinzel', 'Times New Roman', serif" font-size="34" font-weight="700" 
          fill="url(#embGold)" stroke="#593902" stroke-width="0.8" text-anchor="middle" dominant-baseline="central">
      G
    </text>
  </g>
</svg>
