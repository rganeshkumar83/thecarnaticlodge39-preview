<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2f"/>
      <stop offset="70%" stop-color="#1b2e4d"/>
      <stop offset="100%" stop-color="#2d4263"/>
    </linearGradient>
    <linearGradient id="hallGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="50%" stop-color="#e9d38c"/>
      <stop offset="100%" stop-color="#ab8235"/>
    </linearGradient>
  </defs>

  <!-- Sky & Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Subtle Moon & Stars -->
  <circle cx="680" cy="90" r="35" fill="#fefae0" opacity="0.8" />
  <circle cx="695" cy="85" r="30" fill="#1b2e4d" />
  <g fill="#d4af37" opacity="0.6">
    <circle cx="120" cy="60" r="1.5"/><circle cx="240" cy="80" r="1"/><circle cx="380" cy="50" r="2"/>
    <circle cx="510" cy="70" r="1.5"/><circle cx="600" cy="40" r="1"/>
  </g>

  <!-- Lawn Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#0d1b1e"/>
  <rect x="0" y="380" width="800" height="6" fill="#c5a059"/>

  <!-- Freemasons Hall Facade (Egmore Chennai Neo-Classical Heritage Building) -->
  <!-- Main Central Pediment & Portico -->
  <g transform="translate(400, 260)">
    <!-- Base Plinth -->
    <rect x="-320" y="70" width="640" height="50" fill="#19283f" stroke="#c5a059" stroke-width="1.5"/>
    <!-- Building Wings Left and Right -->
    <rect x="-300" y="-70" width="130" height="140" fill="#142136" stroke="#c5a059" stroke-width="1"/>
    <rect x="170" y="-70" width="130" height="140" fill="#142136" stroke="#c5a059" stroke-width="1"/>
    
    <!-- Classical Windows in Wings -->
    <rect x="-275" y="-40" width="35" height="55" rx="17" fill="#080f1a" stroke="#d4af37" stroke-width="1.2"/>
    <rect x="-220" y="-40" width="35" height="55" rx="17" fill="#080f1a" stroke="#d4af37" stroke-width="1.2"/>
    <rect x="185" y="-40" width="35" height="55" rx="17" fill="#080f1a" stroke="#d4af37" stroke-width="1.2"/>
    <rect x="240" y="-40" width="35" height="55" rx="17" fill="#080f1a" stroke="#d4af37" stroke-width="1.2"/>

    <!-- Central Grand Portico -->
    <rect x="-170" y="-80" width="340" height="150" fill="#17263c" stroke="#d4af37" stroke-width="1.5"/>

    <!-- Portico Triangular Pediment -->
    <polygon points="0,-165 -190,-80 190,-80" fill="#1c2f4a" stroke="url(#hallGold)" stroke-width="2"/>
    
    <!-- Masonic Emblem in Tympanum -->
    <circle cx="0" cy="-108" r="24" fill="#0c1726" stroke="#d4af37" stroke-width="1.5"/>
    <polygon points="0,-124 5,-110 16,-105 5,-100 0,-86 -5,-100 -16,-105 -5,-110" fill="#d4af37"/>
    <text x="0" y="-103" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#0c1726" text-anchor="middle">G</text>

    <!-- Frieze Banner Under Pediment -->
    <rect x="-180" y="-78" width="360" height="24" fill="#0a1320" stroke="#d4af37" stroke-width="1"/>
    <text x="0" y="-62" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#e9d38c" letter-spacing="4" text-anchor="middle">FREEMASONS' HALL • EGMORE</text>

    <!-- Grand Classical Columns (4 Front Columns) -->
    <!-- Col 1 -->
    <rect x="-140" y="-54" width="18" height="124" fill="url(#hallGold)"/>
    <!-- Col 2 -->
    <rect x="-50" y="-54" width="18" height="124" fill="url(#hallGold)"/>
    <!-- Col 3 -->
    <rect x="32" y="-54" width="18" height="124" fill="url(#hallGold)"/>
    <!-- Col 4 -->
    <rect x="122" y="-54" width="18" height="124" fill="url(#hallGold)"/>

    <!-- Grand Entrance Double Doors -->
    <rect x="-30" y="0" width="60" height="70" rx="30" fill="#080e18" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="70" stroke="#d4af37" stroke-width="1.5"/>

    <!-- Balustrade Roof Railing -->
    <line x1="-310" y1="-70" x2="310" y2="-70" stroke="#d4af37" stroke-width="2"/>
    <g stroke="#d4af37" stroke-width="1">
      <line x1="-280" y1="-70" x2="-280" y2="-82"/>
      <line x1="-240" y1="-70" x2="-240" y2="-82"/>
      <line x1="-200" y1="-70" x2="-200" y2="-82"/>
      <line x1="200" y1="-70" x2="200" y2="-82"/>
      <line x1="240" y1="-70" x2="240" y2="-82"/>
      <line x1="280" y1="-70" x2="280" y2="-82"/>
    </g>
  </g>

  <!-- Front Garden Trees / Foliage Silhouettes -->
  <circle cx="80" cy="380" r="45" fill="#0a171a"/>
  <circle cx="120" cy="370" r="35" fill="#0d1f23"/>
  <circle cx="680" cy="375" r="40" fill="#0d1f23"/>
  <circle cx="725" cy="380" r="48" fill="#0a171a"/>

  <!-- Plaque at bottom -->
  <g transform="translate(400, 460)">
    <rect x="-180" y="-18" width="360" height="36" rx="4" fill="#091322" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Cinzel', serif" font-size="13" font-weight="600" fill="#d4af37" letter-spacing="2" text-anchor="middle">
      MEETING HOME OF CARNATIC LODGE NO. 39
    </text>
  </g>
</svg>
