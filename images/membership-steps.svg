<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="memBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#122544"/>
    </linearGradient>
    <linearGradient id="stepGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6418"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#memBg)"/>

  <!-- Step Pillars & Steps Illustration -->
  <g transform="translate(80, 80)">
    <!-- Step 1 -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="115" height="120" rx="6" fill="#080f1b" stroke="#d4af37" stroke-width="1.2"/>
      <circle cx="57" cy="35" r="22" fill="#142642" stroke="url(#stepGold)" stroke-width="1.5"/>
      <text x="57" y="42" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#d4af37" text-anchor="middle">1</text>
      <text x="57" y="75" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">INQUIRY</text>
      <text x="57" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#adbcd0" text-anchor="middle">Ask a Mason</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(130, 190)">
      <rect x="0" y="0" width="115" height="170" rx="6" fill="#080f1b" stroke="#d4af37" stroke-width="1.2"/>
      <circle cx="57" cy="35" r="22" fill="#142642" stroke="url(#stepGold)" stroke-width="1.5"/>
      <text x="57" y="42" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#d4af37" text-anchor="middle">2</text>
      <text x="57" y="75" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">DIALOGUE</text>
      <text x="57" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#adbcd0" text-anchor="middle">Informal Meet</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(260, 140)">
      <rect x="0" y="0" width="115" height="220" rx="6" fill="#080f1b" stroke="#d4af37" stroke-width="1.2"/>
      <circle cx="57" cy="35" r="22" fill="#142642" stroke="url(#stepGold)" stroke-width="1.5"/>
      <text x="57" y="42" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#d4af37" text-anchor="middle">3</text>
      <text x="57" y="75" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">PETITION</text>
      <text x="57" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#adbcd0" text-anchor="middle">Application</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(390, 90)">
      <rect x="0" y="0" width="115" height="270" rx="6" fill="#080f1b" stroke="#d4af37" stroke-width="1.2"/>
      <circle cx="57" cy="35" r="22" fill="#142642" stroke="url(#stepGold)" stroke-width="1.5"/>
      <text x="57" y="42" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#d4af37" text-anchor="middle">4</text>
      <text x="57" y="75" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">BALLOT</text>
      <text x="57" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#adbcd0" text-anchor="middle">Lodge Vote</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(520, 40)">
      <rect x="0" y="0" width="120" height="320" rx="6" fill="#122544" stroke="url(#stepGold)" stroke-width="2"/>
      <circle cx="60" cy="35" r="24" fill="#080f1b" stroke="url(#stepGold)" stroke-width="2"/>
      <text x="60" y="42" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="url(#stepGold)" text-anchor="middle">5</text>
      <text x="60" y="75" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#ffe28a" text-anchor="middle">INITIATION</text>
      <text x="60" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#fff" text-anchor="middle">Into the Craft</text>
    </g>
  </g>

  <!-- Title Ribbon -->
  <g transform="translate(400, 40)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#080f1b" stroke="#d4af37" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#d4af37" letter-spacing="3" text-anchor="middle">
      THE 5 STEPS TO CRAFT FREEMASONRY
    </text>
  </g>
</svg>
